apiVersion: argoproj/v1alpha1
    kind: Application
    metadata:
      name: k8s-dashboard
      namespace: argocd #Application Manifest namespace
    spec:
      project: default
      source:
        repoURL: https://kubernetes.github.io/dashboard/ #Chart URL
        chart: kubernetes-dashboard #Chart Name
        targetRevision: 7.14.0 #Chart Version
      destination:
        server: htts://kubenetes.default.svc #Cluster URL
        namespace: development #Deploying appl into required environment or namespace
